name: super_green_app
description: SuperGreenLab&#x27;s mobile app

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.2.42+128

publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_portal:
  flutter_slidable:
  cached_network_image:
  favicon:
  flutter_datetime_picker_plus:
  webview_flutter_plus: ^0.4.20
  envied:
  envied_generator:
  qr_flutter:
  web_socket_channel:
  uuid:
  animated_size_and_fade:
  # heic_to_jpg, uni_links and share_extend used the Android v1 embedding,
  # removed in Flutter 3.29
  flutter_image_compress: ^2.4.0
  enum_to_string:
  app_links: ^7.0.0
  tuple:
  share_plus: ^13.3.0
  fluttertoast:
  flutter_email_sender:
  visibility_detector:
  devicelocale:
  yaml:
  camera:
  multicast_dns:
  http:
  rxdart:
  flutter_svg:
  # 13.x (permission_handler_android 14) requires AGP 9 / Kotlin 2.3 (see android/settings.gradle)
  permission_handler: ^13.0.2
  drift: ^2.34.0
  # sqlite3 3.x builds/ships the native library itself through Dart build
  # hooks: sqlite3_flutter_libs is not needed any more
  sqlite3: ^3.5.0
  path_provider:
  path:
  # hive 2 / hive_generator are unmaintained and pin source_gen 1 (blocks
  # drift_dev >= 2.28); hive_ce is the maintained continuation, same box format
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.0
  bloc:
  bloc_concurrency:
  flutter_bloc:
  provider:
  equatable:
  url_launcher:
  basic_utils:
  flutter_speed_dial:
    path: ./vendor/flutter_speed_dial
  event_bus:
  video_player:
  flutter_keyboard_visibility:
  video_thumbnail:
  flutter_localizations:
    sdk: flutter
  intl:
  # intl_generator / intl_translation (used only by generate_l10n.sh) pin
  # intl < 0.20 and block the resolution: activate them globally when the
  # translations need regenerating (see the script)
  card_swiper:
  fl_chart: ^1.2.0
  # flutter_markdown is discontinued; flutter_markdown_plus is its drop-in successor
  flutter_markdown_plus: ^1.0.12
  matrix_gesture_detector:
    path: ./vendor/matrix_gesture_detector
  connectivity_plus: ^7.0.0
  firebase_messaging:
  firebase_core:
  flutter_local_notifications:
  exif:
  auto_size_text:
  media_picker_builder:
    # path: ../media_picker_builder/ 
    # git: https://github.com/VidCamera/media_picker_builder.git
    git: https://github.com/supergreenlab/media_picker_builder.git
  image:
    # git: https://github.com/supergreenlab/image.git
  # flutter_image_compress:
  device_info_plus:
  wifi_iot:
    # git: https://github.com/alternadom/WiFiFlutter.git
  flutter:
    sdk: flutter
  cupertino_icons:
  package_info_plus: ^10.2.1
  shared_preferences:
  flutter_screen_lock: ^9.0.1
  crisp_chat: ^2.0.2
  flutter_background_service: ^5.1.0

dev_dependencies:
  hive_ce_generator: ^1.11.0
  drift_dev: ^2.34.0
  build_runner:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Static instances of Google Fonts (OFL, see assets/fonts/OFL.txt):
  # Bricolage Grotesque for display, Instrument Sans for body, IBM Plex Mono
  # for readings. Declared here so the app never depends on the network.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

  assets:
    - assets/
    - assets/splash/
    - assets/feed_form/
    - assets/plant_infos/
    - assets/feed_card/
    - assets/box_setup/
    - assets/home/
    - assets/checklist/
    - assets/tutos/
    - assets/settings/
    - assets/products/
    - assets/products/bundle/
    - assets/products/growbox/
    - assets/products/growing_medium/
    - assets/products/nutrients/
    - assets/products/seeds/
    - assets/products/toolbox/
    - assets/explorer/
    - assets/app_bar/
    - assets/firmware/ControllerV2.1/
    - assets/firmware/ControllerV3/
    - assets/firmware/SoloV2.1/
    - assets/firmware/PickleV2.1/
    - assets/firmware/DriverV2.1/
    - assets/firmware/ScreenV1/
    - assets/firmware/TipsV1/
    - assets/firmware/ControllerV2.1/html_app/
    - assets/firmware/ControllerV3/html_app/
    - assets/firmware/SoloV2.1/html_app/
    - assets/firmware/PickleV2.1/html_app/
    - assets/firmware/DriverV2.1/html_app/
    - assets/firmware/ScreenV1/html_app/
    - assets/firmware/TipsV1/html_app/
